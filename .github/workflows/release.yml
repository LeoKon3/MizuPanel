name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.created }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      revision: ${{ steps.release.outputs.revision }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Resolve and verify release identity
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version="$(tr -d '\r\n ' < VERSION)"
          test "$RELEASE_TAG" = "v$version"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run Go test suite
        run: go test ./...

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Run frontend test suite
        run: npm test --prefix web

      - name: Build frontend
        run: npm run build --prefix web

  release-packages:
    name: Build and upload release packages
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.revision }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Linux cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Build release packages
        run: make package-linux-amd64 package-linux-arm64

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-release.outputs.release_tag }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: true
          files: |
            dist/mizupanel-linux-amd64.tar.gz
            dist/mizupanel-linux-arm64.tar.gz

  release-image:
    name: Build and push Docker image
    needs: verify-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.revision }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: leokon3/mizupanel
          tags: |
            type=raw,value=${{ needs.verify-release.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.created=${{ needs.verify-release.outputs.created }}
            org.opencontainers.image.revision=${{ needs.verify-release.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify-release.outputs.version }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mizupanel-release
          cache-to: type=gha,mode=max,scope=mizupanel-release
