name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: leokon3/mizupanel

jobs:
  verify-release:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.created }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      revision: ${{ steps.release.outputs.revision }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Resolve and verify release identity
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version="$(tr -d '\r\n ' < VERSION)"
          test "$RELEASE_TAG" = "v$version"
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run Go test suite
        run: go test ./...

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Run frontend test suite
        run: npm test --prefix web

      - name: Validate Compose configurations
        env:
          MIZUPANEL_MYSQL_DATABASE: mizupanel
          MIZUPANEL_MYSQL_USERNAME: mizupanel
          MIZUPANEL_MYSQL_PASSWORD: release-validation-password
          MIZUPANEL_MYSQL_ROOT_PASSWORD: release-validation-root-password
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.mysql.yml config --quiet

      - name: Build frontend
        run: npm run build --prefix web

      - name: Upload verified frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: verified-web-dist-${{ steps.release.outputs.revision }}
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  build-packages:
    name: Build release package (${{ matrix.arch }})
    needs: verify-release
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.revision }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download verified frontend assets
        uses: actions/download-artifact@v4
        with:
          name: verified-web-dist-${{ needs.verify-release.outputs.revision }}
          path: web/dist

      # Native runner: GOARCH matches the machine, so CGO links with the
      # system gcc. No cross compiler and no QEMU emulation are involved.
      - name: Build release package
        run: make SKIP_WEB_BUILD=1 "package-linux-${{ matrix.arch }}" "${{ matrix.arch == 'arm64' && 'ARM64_CC=gcc' || 'AMD64_CC=gcc' }}"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ matrix.arch }}
          path: dist/mizupanel-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-image:
    name: Build image (${{ matrix.arch }})
    needs: verify-release
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.revision }}

      - name: Download verified frontend assets
        uses: actions/download-artifact@v4
        with:
          name: verified-web-dist-${{ needs.verify-release.outputs.revision }}
          path: web/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.created=${{ needs.verify-release.outputs.created }}
            org.opencontainers.image.revision=${{ needs.verify-release.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify-release.outputs.version }}

      # Native single-arch build pushed by digest; the multi-arch manifest is
      # assembled later in merge-image. BUILDPLATFORM == TARGETPLATFORM here, so
      # the Go/CGO server build runs natively without emulation.
      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WEB_ASSETS_STAGE=prebuilt-web
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=mizupanel-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=mizupanel-release-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-image:
    name: Publish multi-arch image
    needs: [verify-release, build-image]
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.verify-release.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect published image
        run: |
          docker buildx imagetools inspect \
            "${{ env.IMAGE_NAME }}:${{ needs.verify-release.outputs.version }}"

  publish-release:
    name: Publish GitHub release
    needs: [verify-release, build-packages, merge-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-package-*
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-release.outputs.release_tag }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: true
          files: |
            dist/mizupanel-linux-amd64.tar.gz
            dist/mizupanel-linux-arm64.tar.gz
